apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app
  namespace: devops
  annotations:
    deployment.kubernetes.io/revision: "5"
    kubectl.kubernetes.io/last-applied-configuration: |
      {"apiVersion":"apps/v1","kind":"Deployment","metadata":{"annotations":{},"name":"spring-app","namespace":"devops"},"spec":{"replicas":2,"selector":{"matchLabels":{"app":"spring-app"}},"template":{"metadata":{"labels":{"app":"spring-app"}},"spec":{"containers":[{"envFrom":[{"configMapRef":{"name":"spring-config"}},{"secretRef":{"name":"spring-secret"}}],"image":"meriemhamoda/student-app:1.0.0","name":"spring-app","ports":[{"containerPort":8089}]}]}}}}
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: spring-app
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: spring-app
      annotations:
        kubectl.kubernetes.io/restartedAt: "2025-12-17T20:55:44Z"
    spec:
      containers:
      - name: spring-app
        image: meriemhamoda/student-app:1.0.0
        ports:
        - containerPort: 8089
        envFrom:
        - configMapRef:
            name: spring-config
        - secretRef:
            name: spring-secret
        command: ["java"]
        args: ["-jar", "/app/app.jar"]
