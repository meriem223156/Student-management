---
# ConfigMap pour les variables non sensibles
apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-config
  namespace: devops
data:
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql-service:3306/springdb
  # Ajoutez d'autres variables de configuration si nécessaire
---
# Secret pour les credentials (sensibles)
apiVersion: v1
kind: Secret
metadata:
  name: spring-secret
  namespace: devops
type: Opaque
data:
  SPRING_DATASOURCE_USERNAME: c3ByaW5n  # "spring" en base64
  SPRING_DATASOURCE_PASSWORD: c3ByaW5nMTIz  # "spring123" en base64
---
# Deployment Spring Boot
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app
  namespace: devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-app
        image: meriemhamouda/student-app:1.0.0  # Remplacez par votre image Docker
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: spring-config
        - secretRef:
            name: spring-secret
        # Si nécessaire, ajoutez d'autres variables d'environnement ici
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "default"
---
# Service NodePort pour exposer l'application
apiVersion: v1
kind: Service
metadata:
  name: spring-service
  namespace: devops
spec:
  type: NodePort
  selector:
    app: spring-app
  ports:
  - port: 8089
    targetPort: 8089
    nodePort: 30080  # Port exposé sur le nœud (30000-32767)
